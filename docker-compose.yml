version: '3.8'

services:
  api:
    build: .
    container_name: gossip_garden_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Sincronización en vivo para desarrollo local
      - .:/app
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: gossip_garden_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
